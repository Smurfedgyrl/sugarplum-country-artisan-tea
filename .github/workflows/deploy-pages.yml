name: Publish Tea Collection display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build preview files
        run: |
          cat sugarplum-tea-collection.zip.part1 sugarplum-tea-collection.zip.part2 > tea-collection.zip
          mkdir _site
          unzip -q tea-collection.zip -d _site
          rm -rf _site/.openai
          cat safe-data.part* | tr -d '\r\n' | base64 --decode > _site/data.js
          cp index.html _site/index.html
          cp script.js _site/script.js
          cp styles.css _site/styles.css
          sed -i 's/data.js?v=[0-9]*/data.js?v=34/' _site/index.html
          sed -i 's/script.js?v=[0-9]*/script.js?v=86/' _site/index.html
          sed -i 's/styles.css?v=[0-9]*/styles.css?v=113/' _site/index.html
          mkdir -p _site/assets
          cp assets/green-header-clean.jpg _site/assets/green-header-clean.jpg
          cp assets/green-header-functional-search.png _site/assets/green-header-functional-search.png
          cp -r assets/metro-wellness _site/assets/metro-wellness
          test "$(find _site/assets/metro-wellness -maxdepth 1 -type f | wc -l)" -eq 70
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Tea Collection
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish preview files
        id: deployment
        uses: actions/deploy-pages@v4

